# CI for every PR and main push (spec §17 Definition of Done: acceptance
# automated; §18 CI/CD). Independent jobs so a Flutter toolchain hiccup
# never blocks a web-only change from getting its verdict.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # The suite runs in about a minute; the browser download in front of it is
    # the part that hangs. Without a cap a stuck mirror burns the six-hour
    # default before anyone finds out the job was never going to finish.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # --with-deps pulls OS packages through apt as well as the browser, and
      # either half can stall on a bad mirror. Fail the step rather than the job.
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npm run build
      - run: npm run e2e

  mobile:
    name: Mobile (analyze, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
